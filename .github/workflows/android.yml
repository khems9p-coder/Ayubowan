name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web app into the www folder
        run: |
          mkdir www
          for f in *; do
            case "$f" in
              package.json|package-lock.json|capacitor.config.json|README.md|www|node_modules|android) ;;
              *.txt|*.yml|*.zip|*.md) ;;
              *) [ -f "$f" ] && cp "$f" www/ ;;
            esac
          done
          echo "Files in www: $(ls www | wc -l)"
          test -f www/index.html && test -f www/book.json && test -f www/toc.json

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Target Android 16 (API 36) and number the build
        run: |
          sed -i -E 's/(targetSdkVersion *= *)[0-9]+/\136/; s/(compileSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat android/variables.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Make the app icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('icon-512.png').convert('RGBA')
          res = 'android/app/src/main/res'
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for n, (l, f) in dens.items():
              d = f'{res}/mipmap-{n}'
              os.makedirs(d, exist_ok=True)
              a = src.resize((l, l), Image.LANCZOS)
              m = Image.new('L', (l, l), 0)
              ImageDraw.Draw(m).rounded_rectangle((0, 0, l - 1, l - 1), radius=l // 5, fill=255)
              q = a.copy(); q.putalpha(m); q.save(d + '/ic_launcher.png')
              m = Image.new('L', (l, l), 0)
              ImageDraw.Draw(m).ellipse((0, 0, l - 1, l - 1), fill=255)
              r = a.copy(); r.putalpha(m); r.save(d + '/ic_launcher_round.png')
              fg = Image.new('RGBA', (f, f), (31, 58, 95, 255))
              i = src.resize((int(f * 0.62), int(f * 0.62)), Image.LANCZOS)
              fg.paste(i, ((f - i.width) // 2, (f - i.height) // 2))
              fg.save(d + '/sg_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/sg_colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="sg_icon_bg">#1F3A5F</color></resources>')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/sg_icon_bg"/><foreground android:drawable="@mipmap/sg_foreground"/></adaptive-icon>'
          for nme in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(res + '/mipmap-anydpi-v26/' + nme, 'w').write(xml)
          PY

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build installable APK (for testing on your phone)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save the test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinhala-Grammar-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build the Play Store release
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign the release files
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs
          $BT/zipalign -p 4 $OUT/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out $OUT/Sinhala-Grammar-release.apk $RUNNER_TEMP/aligned.apk
          cp $OUT/bundle/release/app-release.aab $OUT/Sinhala-Grammar-release.aab
          jarsigner -storetype pkcs12 -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" $OUT/Sinhala-Grammar-release.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Save the Play Store file
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Sinhala-Grammar-PlayStore-AAB
          path: android/app/build/outputs/Sinhala-Grammar-release.aab
