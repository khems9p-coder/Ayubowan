name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web app into the www folder
        run: |
          mkdir www
          for f in *; do
            case "$f" in
              package.json|package-lock.json|capacitor.config.json|README.md|www|node_modules|android) ;;
              *.txt|*.yml|*.zip|*.md) ;;
              *) [ -f "$f" ] && cp "$f" www/ ;;
            esac
          done
          echo "Files in www: $(ls www | wc -l)"
